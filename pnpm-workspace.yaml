allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

overrides:
  tar: 7.5.22
  # postcss-styl still requests Stylus 0.57, whose obsolete css/source-map-resolve
  # chain uses vulnerable decode-uri-component. Preserve the CJS parser API by
  # upgrading Stylus instead of overriding the decoder with an ESM-only version.
  'postcss-styl>stylus': 0.64.0

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release. It is reached only through dev-time
    # glob tooling (fast-glob, micromatch, chokidar) matching repository-owned
    # patterns, never untrusted input. Remove once a fixed version ships.
    - GHSA-vfj7-8cjw-p6xm
