<section
  class="ak-loading-screen"
  data-loading-screen
  data-state="loading"
  role="status"
  aria-label="正在同步终端资源"
>
  <img
    class="ak-loading-screen__backdrop"
    src="/img/bg/loading-terminal-v2.png"
    alt=""
    aria-hidden="true"
  >
  <p class="ak-loading-screen__tip">Tips: 首次加载会同步字体与界面资源，请稍候。</p>
  <div class="ak-loading-screen__identity" aria-hidden="true">
    <span class="ak-loading-screen__brand">
      <strong>AK TACTICAL TERMINAL</strong>
      <small>Medical Operations Interface</small>
    </span>
    <span class="ak-loading-screen__mark">
      <svg class="ak-icon"><use href="#icon-rook"></use></svg>
      <small>AK / UI</small>
    </span>
  </div>
  <div class="ak-loading-screen__progress">
    <div class="ak-loading-track">
      <span class="ak-loading-track__runner" aria-hidden="true"></span>
      <span class="ak-loading-track__label">Loading</span>
    </div>
  </div>
</section>
