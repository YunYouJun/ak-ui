<div style="position: relative; width: 100%; height: 400px; container-type: inline-size">
  <section class="ak-screen ak-screen--cyan" aria-label="采购中心">
    <span class="ak-screen__watermark" aria-hidden="true">Store</span>
    <header class="ak-screen__bar">
      <button class="ak-screen__back" type="button"><span aria-hidden="true">‹</span> 返回</button>
      <div class="ak-screen__heading">
        <span class="ak-screen__eyebrow">Store / Credit Exchange</span>
        <h2 class="ak-screen__title">采购中心</h2>
      </div>
      <div class="ak-screen__meta"><span>信用 <b>300</b></span></div>
    </header>
    <div class="ak-screen__body">
      <p class="ak-screen__section-title">信用交易所 <small>Refreshes daily</small></p>
      <div class="ak-screen__grid" style="--ak-screen-grid-min: 7rem">
        <button class="ak-item ak-item--tier-3" type="button"><span class="ak-item__icon" aria-hidden="true"></span><span class="ak-item__name">电路板</span><span class="ak-item__price">80 信用</span></button>
        <button class="ak-item ak-item--tier-4" type="button"><span class="ak-item__icon" aria-hidden="true"></span><span class="ak-item__name">核心芯片</span><span class="ak-item__price">160 信用</span></button>
        <button class="ak-item ak-item--tier-2" type="button"><span class="ak-item__icon" aria-hidden="true"></span><span class="ak-item__name">合金块</span><span class="ak-item__price">40 信用</span></button>
        <button class="ak-item ak-item--tier-5 ak-item--sold" type="button" disabled><span class="ak-item__icon" aria-hidden="true"></span><span class="ak-item__name">结晶组件</span><span class="ak-item__price">已售罄</span></button>
      </div>
    </div>
  </section>
</div>
