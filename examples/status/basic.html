<div class="ak-tag-group" aria-label="干员标签">
  <span class="ak-tag">先锋</span>
  <span class="ak-tag ak-tag--advanced">高级资深干员</span>
  <span class="ak-tag ak-tag--danger">感染者</span>
  <span class="ak-tag ak-tag--neutral">未编入</span>
</div>

<div class="ak-status-group" aria-label="终端状态">
  <span class="ak-status">
    <span class="ak-status__signal" aria-hidden="true"></span>
    <span class="ak-status__label">Online</span>
    <span class="ak-status__detail">作战终端已连接</span>
  </span>
  <span class="ak-status ak-status--warning">
    <span class="ak-status__signal" aria-hidden="true"></span>
    <span class="ak-status__label">Caution</span>
    <span class="ak-status__detail">理智低于警戒值</span>
  </span>
  <span class="ak-status ak-status--offline">
    <span class="ak-status__signal" aria-hidden="true"></span>
    <span class="ak-status__label">Offline</span>
    <span class="ak-status__detail">信号中断</span>
  </span>
</div>
