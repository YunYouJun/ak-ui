<div style="display: grid; width: min(100%, 44rem); grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.75rem">
  <div class="ak-slot ak-slot--vanguard ak-slot--rarity-5">
    <span class="ak-slot__code" aria-hidden="true">VAN</span>
    <span class="ak-slot__rarity" aria-label="5 星">★★★★★</span>
    <strong class="ak-slot__name">Aster</strong>
    <span class="ak-slot__meta">先锋 · LV.60</span>
  </div>
  <button class="ak-slot ak-slot--guard ak-slot--rarity-6" type="button" aria-pressed="true">
    <span class="ak-slot__code" aria-hidden="true">GRD</span>
    <span class="ak-slot__rarity" aria-label="6 星">★★★★★★</span>
    <strong class="ak-slot__name">Brass</strong>
    <span class="ak-slot__meta">近卫 · LV.80</span>
  </button>
  <button class="ak-slot ak-slot--medic ak-slot--rarity-4" type="button" aria-pressed="false">
    <span class="ak-slot__code" aria-hidden="true">MED</span>
    <span class="ak-slot__rarity" aria-label="4 星">★★★★</span>
    <strong class="ak-slot__name">Flint</strong>
    <span class="ak-slot__meta">医疗 · LV.50</span>
  </button>
  <div class="ak-slot ak-slot--empty"><span aria-hidden="true">+</span><span class="ak-slot__meta">空位</span></div>
</div>
