<div class="ak-progress-stack">
  <div class="ak-progress" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78" style="--ak-progress-value: 78%">
    <div class="ak-progress__header"><span>Operator HP</span><span class="ak-progress__value">78%</span></div>
    <div class="ak-progress__track"><span class="ak-progress__fill"></span></div>
  </div>
  <div class="ak-progress ak-progress--warning" role="progressbar" aria-label="技力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42" style="--ak-progress-value: 42%">
    <div class="ak-progress__header"><span>Skill Point</span><span class="ak-progress__value">42 / 100</span></div>
    <div class="ak-progress__track"><span class="ak-progress__fill"></span></div>
  </div>
</div>

<div class="ak-gauge ak-gauge--warning" role="progressbar" aria-label="部署进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68" style="--ak-gauge-value: 68%">
  <div class="ak-gauge__content">
    <span class="ak-gauge__label">Deploy</span>
    <strong class="ak-gauge__value">68</strong>
    <span class="ak-gauge__unit">percent</span>
  </div>
</div>
