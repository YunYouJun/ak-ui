name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:deps

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint styles
        run: pnpm lint

      - name: Build documentation
        run: pnpm docs:build

      - name: Verify design token contract
        run: pnpm tokens:verify

      - name: Verify Vue registry installation
        run: pnpm registry:verify

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Upload component captures
        if: failure() || github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-captures
          path: test-results/**/component-captures/*.webp
          if-no-files-found: warn
          retention-days: 14
