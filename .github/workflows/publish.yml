name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          git fetch origin master:refs/remotes/origin/master --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint styles
        run: pnpm lint

      - name: Build documentation
        run: pnpm docs:build

      - name: Verify Vue registry installation
        run: pnpm registry:verify

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Pack verified package
        shell: bash
        run: |
          mkdir -p release
          tarball="$(npm pack --silent)"
          mv "$tarball" "release/$tarball"
          test -f "release/$tarball"

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.15.0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release

      - name: Publish with npm Trusted Publishing
        run: npm publish release/*.tgz --tag "${{ steps.release.outputs.dist-tag }}" --access public
